# Deploy to Production — сборка НА ВМ, без реестра контейнеров
# (CI-DEPLOY-NOREGISTRY-01, решение владельца 2026-08-07: реестр не используем,
# образы собираются на прод-ВМ; прежний вариант падал на «Login to Yandex
# Container Registry: Password required» на каждом пуше в main).
#
# AUTO-DEPLOY-01 (2026-09-01, решение владельца): деплой запускается САМ по
# завершении workflow `CI` на `main` с зелёным результатом (`workflow_run`) —
# то есть после мержа PR, который прошёл гейты. Красный CI → этот workflow не
# стартует вовсе. Ручной запуск (`workflow_dispatch`) сохранён для повторов и
# отката вперёд. «Мерж запрещён, пока CI красный» enforce'ится НЕ здесь, а
# защитой ветки main в настройках репозитория (required status checks) —
# workflow сам себя гейтом сделать не может.
#
# Деплоится РОВНО тот SHA, на котором CI позеленел: job `guard` сверяет его с
# текущей вершиной main и пропускает прогон, если main уже ушёл вперёд (новый
# коммит задеплоит свой прогон); скрипт на ВМ повторяет ту же сверку после
# `git pull` — окно гонки между проверкой и pull закрыто с обеих сторон.
#
# Без секретов ВМ (PROD_HOST / PROD_USER / PROD_SSH_KEY) job deploy помечается
# «пропущено», а не «упало»: secrets-контекст недоступен в job-level `if`,
# поэтому наличие секретов проверяет отдельный preflight-job через outputs.
#
# Схема на ВМ: git pull → тег текущих образов как :previous (ДО сборки — иначе
# откатываться не на что) → docker compose build (последовательно, heap-кап
# BUILD_NODE_OPTIONS из compose) → СНИМОК БД (pg_dump -Fc, последние 7 в
# /opt/app/backups — точка возврата после миграций, которые откатом не
# отменяются) → миграции → up -d готовыми образами (downtime не включает время
# сборки) → healthcheck → при неуспехе автооткат на :previous и ненулевой exit.
# Между миграциями и подъёмом — сид тарифов (`npm run seed:plans`, идемпотентный).
# Подробности и ручной откат — DEPLOY-BACKLOG.md.
#
# Уведомления (job notify, всегда): Telegram через Bot API (curl, без сторонних
# экшенов; тот же ops-бот, что MONITORING_TELEGRAM_* в приложении) и письмо
# через SMTP Яндекса теми же кредами, что у приложения. Каждый канал молча
# пропускается, если его секреты не заведены.
#
# APP-TIER-SPLIT-02 (2026-08-31, сверено с боевым стендом): каталог `/opt/app`,
# принадлежит root; ярус приложения — ОДИН образ beautyhub-app, ДВА контейнера
# (web — страницы, api — /api/*) за traefik из того же compose (TLS, LE);
# Postgres — на отдельном хосте (профиль `db`), поэтому миграция идёт
# `--profile db run --rm --no-deps migrate`. Собирается только `web` (api берёт
# тот же тег); healthcheck ждёт web+api; откат перекатывает web+api+worker.
# Если SSH-пользователь не root — весь docker/git идёт через `sudo -n`
# (у деплой-пользователя passwordless sudo).
#
# ⚠️ Скрипт исполняется login-shell'ом SSH-пользователя — на стенде это dash,
# не bash. Никаких bashизмов: `${VAR:0:8}`, `[[ ]]`, массивов, `pipefail`.
# Пин — src/lib/http/app-tier-topology.test.ts.

name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Ветка для деплоя (именно ветка: тег даст detached HEAD и громкий отказ pull --ff-only)"
        required: false
        default: "main"

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Секреты ВМ заданы?
    # Автозапуск — только на ЗЕЛЁНОМ CI. Красный/отменённый CI не должен даже
    # доходить до preflight: иначе каждый провал CI рисовал бы «пропущенный деплой».
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # То же окружение, что у deploy-job: секреты, заведённые как environment-секреты
    # `production` (естественное место для деплой-кредов), видны ТОЛЬКО job'ам с этим
    # окружением — без этой строки preflight читал бы пустоту и рапортовал
    # «не заданы» на полностью провиженном сетапе.
    environment: production
    outputs:
      has-vm-secrets: ${{ steps.check.outputs.ok }}
      expected-sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Проверить наличие секретов ВМ
        id: check
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -n "$PROD_HOST" ] && [ -n "$PROD_USER" ] && [ -n "$PROD_SSH_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Секреты ВМ (PROD_HOST / PROD_USER / PROD_SSH_KEY) не заданы — деплой пропущен. Это ожидаемо до провижининга ВМ. Заводить их как секреты окружения production (или репозитория)."
          fi
      - name: Зафиксировать SHA, прошедший CI
        id: sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # При ручном запуске SHA не фиксируется — деплоится вершина указанной ветки.
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy (build on VM)
    needs: preflight
    if: needs.preflight.outputs.has-vm-secrets == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      skipped: ${{ steps.guard.outputs.skip }}
      ssh-outcome: ${{ steps.ssh.outcome }}
    steps:
      - name: main не ушёл вперёд? (деплоим ровно тот SHA, что прошёл CI)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ needs.preflight.outputs.expected-sha }}
        run: |
          if [ -z "$EXPECTED" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOW="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          if [ "$NOW" != "$EXPECTED" ]; then
            echo "::notice::main уже на ${NOW}, а CI прошёл ${EXPECTED} — этот прогон пропущен: новый коммит задеплоит свой прогон, когда его CI позеленеет."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH (git pull → build → snapshot → migrate → up → healthcheck/rollback)
        id: ssh
        if: steps.guard.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        env:
          GIT_REF: ${{ inputs.git_ref || 'main' }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected-sha }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GIT_REF,EXPECTED_SHA
          # Сборка Next-приложения на ВМ занимает минуты; дефолтных 10m может
          # не хватить на холодный кэш.
          command_timeout: 60m
          script: |
            set -eu

            APP_DIR="/opt/app"
            BACKUP_DIR="$APP_DIR/backups"
            # Сколько снимков БД хранить (самых свежих). Восьмой и старше — удаляются.
            BACKUP_KEEP=7

            # Каталог и docker на стенде принадлежат root. Зашли не root'ом —
            # docker/git идут через sudo (passwordless у деплой-пользователя);
            # `-n` = никогда не ждать пароль, лучше упасть сразу.
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo -n"; fi
            GIT="$SUDO git"
            DOCKER="$SUDO docker"
            COMPOSE_BASE="$SUDO docker compose --env-file .env.production -f docker-compose.prod.yml"
            COMPOSE="$COMPOSE_BASE --profile app"

            cd "$APP_DIR"

            # Автооткат: перетегировать :previous → :latest и перекатить web/api/worker.
            # Зовётся при провале up -d и при провале health/liveness-проверок.
            # Провал МИГРАЦИЙ отката не требует: рестарт ещё не выполнялся, прежняя
            # версия продолжает работать (состояние БД — тема снимка, шаг 4/7).
            # MAINTENANCE-PAGE-01: ориентир окончания работ для страницы «идут
            # работы» (deploy/maintenance). Пишется перед up -d, снимается после
            # успеха или отката — без файла страница показывает общую формулировку.
            ETA_FILE="$APP_DIR/.maintenance-state/eta.json"
            clear_eta() { $SUDO rm -f "$ETA_FILE" 2>/dev/null || true; }

            rollback_and_fail() {
              echo "❌ $1 — автооткат на :previous."
              clear_eta
              if ! $DOCKER image inspect beautyhub-app:previous >/dev/null 2>&1; then
                echo "Образа beautyhub-app:previous НЕТ (первый деплой) — откатываться не на что."
                exit 1
              fi
              $DOCKER image tag beautyhub-app:previous beautyhub-app:latest
              $DOCKER image tag beautyhub-worker:previous beautyhub-worker:latest 2>/dev/null || true
              # --no-deps: migrate повторно не гоняем. Применённые миграции НЕ
              # откатываются — код :previous обязан жить с новой схемой (миграции
              # аддитивны by policy; деструктивные — снимок шага 4/7).
              # traefik не перекатываем: web/api он находит по docker-меткам сам.
              $COMPOSE up -d --no-deps web api worker
              echo "Откат выполнен: web/api/worker подняты из :previous. Деплой ПРОВАЛЕН (exit 1)."
              exit 1
            }

            echo "=== 1/7 Код: git pull (--ff-only: расхождение = громкий отказ, не тихая перезапись) ==="
            # .env.production не в git (untracked) — pull его не трогает; проверка в DEPLOY-BACKLOG.
            $GIT fetch origin "$GIT_REF"
            $GIT checkout "$GIT_REF"
            $GIT pull --ff-only origin "$GIT_REF"
            DEPLOY_SHA="$($GIT rev-parse --short=8 HEAD)"
            echo "HEAD: $DEPLOY_SHA"
            # Вторая половина страховки «деплоим то, что прошло CI»: между проверкой
            # в job guard и этим pull main мог сдвинуться. Ничего на ВМ ещё не
            # менялось — просто выходим; новый коммит приедет своим прогоном.
            if [ -n "${EXPECTED_SHA:-}" ] && [ "$($GIT rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
              echo "❌ HEAD после pull ($($GIT rev-parse HEAD)) ≠ SHA, прошедший CI ($EXPECTED_SHA). Деплой остановлен ДО сборки."
              exit 1
            fi

            echo "=== 2/7 Страховка отката: текущие образы → :previous (строго ДО сборки) ==="
            $DOCKER image tag beautyhub-app:latest beautyhub-app:previous 2>/dev/null \
              && echo "app:previous ← прежний latest" \
              || echo "app: прежнего образа нет (первый деплой) — автоотката не будет"
            $DOCKER image tag beautyhub-worker:latest beautyhub-worker:previous 2>/dev/null \
              && echo "worker:previous ← прежний latest" \
              || echo "worker: прежнего образа нет (первый деплой)"

            echo "=== 3/7 Сборка НА ВМ (последовательно — параллельная пара сборок = риск OOM) ==="
            export NEXT_PUBLIC_GLITCHTIP_RELEASE="$DEPLOY_SHA"
            free -m
            rm -f /tmp/deploy-mem.log
            ( while sleep 10; do free -m | awk '/^Mem:/ {print $3}' >> /tmp/deploy-mem.log; done ) &
            MEM_SAMPLER=$!
            # EXIT-trap: упавшая сборка (set -e) не должна оставить фоновый цикл —
            # висящий семплер держит SSH-канал открытым до command_timeout (60m)
            # и живёт на ВМ вечно.
            trap 'kill "$MEM_SAMPLER" 2>/dev/null || true' EXIT
            $COMPOSE build worker
            # web и api — один образ beautyhub-app:latest; build: объявлен только у web.
            $COMPOSE build web
            kill "$MEM_SAMPLER" 2>/dev/null || true
            if [ -s /tmp/deploy-mem.log ]; then
              echo "Пик used-памяти за сборку (MiB, семплы каждые 10 с): $(sort -n /tmp/deploy-mem.log | tail -1)"
            fi
            rm -f /tmp/deploy-mem.log
            free -m

            echo "=== 4/7 Снимок БД перед миграциями (точка возврата; храним последние $BACKUP_KEEP в $BACKUP_DIR) ==="
            # Миграции откатом НЕ отменяются, а при автодеплое рядом нет человека,
            # который сделал бы снимок руками (DEPLOY-BACKLOG §2). Поэтому снимок —
            # шаг пайплайна, и его провал останавливает деплой ДО изменений.
            # DATABASE_URL читается из .env.production на ВМ и НЕ печатается.
            # `?schema=public` — параметр Prisma, libpq его не знает — отрезаем query.
            $SUDO mkdir -p "$BACKUP_DIR"
            DB_URL="$($SUDO grep -E '^DATABASE_URL=' .env.production | cut -d= -f2- | tr -d "'\"")"
            DB_URL="${DB_URL%%\?*}"
            if [ -z "$DB_URL" ]; then
              echo "❌ DATABASE_URL в .env.production не найден — снимок невозможен, деплой остановлен до миграций."
              exit 1
            fi
            SNAPSHOT_NAME="pre-deploy-${DEPLOY_SHA}-$(date -u +%Y%m%dT%H%M%SZ).dump"
            # pg_dump из официального образа: клиент той же мажорной версии, что
            # сервер (pgvector/pgvector:pg16). --network host — хост БД в приватной
            # сети ВМ. Пишем сразу в bind-mount, без пайпа: код возврата — самого pg_dump.
            if ! $DOCKER run --rm --network host -e PGCONNECT_TIMEOUT=15 \
                 -v "$BACKUP_DIR:/backup" postgres:16-alpine \
                 pg_dump --format=custom --no-owner --no-privileges \
                 --dbname="$DB_URL" -f "/backup/$SNAPSHOT_NAME"; then
              echo "❌ pg_dump не удался — деплой остановлен ДО миграций (ничего не изменено)."
              exit 1
            fi
            # Снимок обязан ЧИТАТЬСЯ, иначе это не точка возврата (DEPLOY-CHECKLIST §2).
            if ! $DOCKER run --rm -v "$BACKUP_DIR:/backup:ro" postgres:16-alpine \
                 pg_restore --list "/backup/$SNAPSHOT_NAME" >/dev/null; then
              echo "❌ pg_restore --list не читает снимок — деплой остановлен ДО миграций."
              exit 1
            fi
            echo "Снимок: $BACKUP_DIR/$SNAPSHOT_NAME ($($SUDO du -h "$BACKUP_DIR/$SNAPSHOT_NAME" | cut -f1))"
            # Ретенция: оставить BACKUP_KEEP самых свежих.
            $SUDO sh -c "ls -1t '$BACKUP_DIR'/pre-deploy-*.dump 2>/dev/null | tail -n +$((BACKUP_KEEP + 1)) | xargs -r rm -f"
            echo "Снимков в хранилище: $($SUDO sh -c "ls -1 '$BACKUP_DIR'/pre-deploy-*.dump 2>/dev/null | wc -l")"

            echo "=== 5/7 Миграции ==="
            # Postgres живёт на отдельном хосте: --no-deps не даёт compose поднять
            # ЛОКАЛЬНЫЙ postgres из профиля db; миграция идёт по DATABASE_URL.
            $COMPOSE_BASE --profile db run --rm --no-deps migrate

            echo "=== 5/7 (б) Тарифы: каталог + стартовая акция (идемпотентно) ==="
            # BILLING-CATALOG-01: тарифы рождаются из кода (src/lib/billing/plan-catalog.ts),
            # тем же worker-образом, что миграции (в web/api нет tsx и исходников).
            # Перезапись тарифов — только при новой версии каталога; пока идёт акция
            # (до 1 ноября) — выдача PREMIUM уже зарегистрированным кабинетам.
            # Провал = стоп ДО рестарта: прежняя версия продолжает работать.
            $COMPOSE_BASE --profile db run --rm --no-deps migrate npm run seed:plans

            echo "=== 5/7 (в) Пост-деплой: ссылки аватаров на вырез + админ-аккаунты (идемпотентно) ==="
            # CROP-PUBLIC-01 + BOOTSTRAP-ADMIN-01 — scripts/post-deploy.ts. Тем же
            # worker-образом; второй проход находит ноль строк. Провал = стоп до рестарта.
            $COMPOSE_BASE --profile db run --rm --no-deps migrate npm run deploy:post

            echo "=== 6/7 Подъём готовыми образами ==="
            # Ориентир для страницы работ: подъём + healthcheck укладываются в 5 минут.
            $SUDO mkdir -p "$APP_DIR/.maintenance-state"
            ETA_UNTIL="$(date -u -d '+5 minutes' +%Y-%m-%dT%H:%M:%SZ)"
            $SUDO sh -c "printf '{\"until\":\"%s\",\"reason\":\"deploy\",\"sha\":\"%s\"}' '$ETA_UNTIL' '$DEPLOY_SHA' > '$ETA_FILE'"
            # --remove-orphans снимает контейнер прежнего монолитного сервиса `app`
            # при первом деплое после разделения web/api.
            $COMPOSE up -d --remove-orphans || rollback_and_fail "up -d не поднял стек (возможно смешанное старое/новое состояние)"

            echo "=== 7/7 Healthcheck: web + api (compose-проба /api/health), маршрутизация traefik, liveness воркера ==="
            # Проба web/api — in-container liveness (FIX-C2). Один бюджет 180 с на сервис.
            wait_healthy() {
              svc="$1"
              cid="$($COMPOSE ps -q "$svc")"
              status=unknown
              for i in $(seq 1 36); do
                status="$($DOCKER inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)"
                if [ "$status" = "healthy" ]; then echo "$svc: healthy"; return 0; fi
                sleep 5
              done
              $DOCKER logs --tail 100 "$cid" 2>&1 || true
              rollback_and_fail "$svc не стал healthy за 180 с (статус: $status)"
            }
            wait_healthy web
            wait_healthy api

            # FIX-C2: compose-проба выше — LIVENESS («процесс обслуживает»), и
            # она намеренно НЕ краснеет на обрыве Redis: иначе частичная
            # деградация выводила бы единственный инстанс из ротации. Но живости
            # мало для вердикта о ДЕПЛОЕ — она не отличает рабочий образ от
            # образа с неверным DATABASE_URL или неприменённой миграцией.
            # Поэтому вторым шагом спрашиваем готовность — у ОБЕИХ половин: это
            # один образ, но два процесса с собственными пулами соединений.
            #
            # 🔴 Гейтом служит ТОЛЬКО `db`. Откат на `:previous` чинит плохую
            # сборку и не чинит лежащий Redis — на старом образе он лежит ровно
            # так же, то есть откат по Redis был бы обрядом, а не средством.
            # Состояние Redis печатается в лог, чтобы деплой в такое окно был
            # виден в истории, а не выглядел безоблачным.
            for svc in web api; do
              CID="$($COMPOSE ps -q "$svc")"
              READY_JSON="$($DOCKER exec "$CID" node -e \
                "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>r.text()).then(t=>{console.log(t)}).catch(e=>{console.log(JSON.stringify({ok:false,dependencies:{db:'unreachable'},error:String(e)}))})" \
                2>/dev/null || echo '{"ok":false,"dependencies":{"db":"unreachable"},"error":"docker exec failed"}')"
              echo "readiness[$svc]: $READY_JSON"
              case "$READY_JSON" in
                *'"db":"ok"'*) : ;;
                *) rollback_and_fail "$svc жив, но не готов: БД недостижима из нового образа ($READY_JSON)" ;;
              esac
              case "$READY_JSON" in
                *'"redis":"down"'*)
                  echo "⚠️  Redis недоступен на момент деплоя ($svc). Откат НЕ делается (он этого не чинит) —"
                  echo "    но чувствительные роуты сейчас fail-closed: docs/runbooks/redis-down.md"
                  ;;
              esac
            done

            # Маршрутизация traefik сквозная: /api/health обязан уйти в api, /robots.txt —
            # в web (роут без БД). Host подставляется через --resolve на loopback, поэтому
            # проверяется именно боевой роутер, а не прямой порт контейнера.
            # Traefik сходится не мгновенно (docker-события, throttle ~2 с, метки новых
            # контейнеров), поэтому — до 10 попыток с шагом 3 с, а не один выстрел.
            if command -v curl >/dev/null 2>&1; then
              for path in /api/health /robots.txt; do
                CODE=000
                for i in $(seq 1 10); do
                  CODE="$(curl -sk -o /dev/null -w '%{http_code}' --resolve masterryadom.ru:443:127.0.0.1 "https://masterryadom.ru$path" || echo 000)"
                  [ "$CODE" = "200" ] && break
                  sleep 3
                done
                echo "traefik $path → $CODE (попыток: $i)"
                [ "$CODE" = "200" ] || rollback_and_fail "traefik не довёл $path до приложения (HTTP $CODE после $i попыток)"
              done
            else
              echo "⚠️  curl на ВМ нет — сквозная проверка traefik пропущена (проверить руками: DEPLOY-CHECKLIST 3.2)"
            fi

            # У воркера нет HTTP-healthcheck'а — liveness по его собственному
            # логу «Worker started» + счётчику рестартов: краш-луп воркера без
            # этой проверки давал бы «✅ деплой успешен» при мёртвых напоминаниях,
            # вебхуках ЮКассы и media.purge.
            WORKER_ID="$($COMPOSE ps -q worker)"
            WORKER_OK=0
            for i in $(seq 1 18); do
              RESTARTS="$($DOCKER inspect -f '{{.RestartCount}}' "$WORKER_ID" 2>/dev/null || echo 1)"
              if [ "$RESTARTS" != "0" ]; then break; fi
              if $DOCKER logs "$WORKER_ID" 2>&1 | grep -q "Worker started"; then WORKER_OK=1; break; fi
              sleep 5
            done
            if [ "$WORKER_OK" != "1" ]; then
              $DOCKER logs --tail 100 "$WORKER_ID" 2>&1 || true
              rollback_and_fail "Worker не дошёл до «Worker started» (рестартов: ${RESTARTS:-?})"
            fi

            clear_eta
            $DOCKER image prune -f >/dev/null
            echo "✅ Деплой $DEPLOY_SHA успешен — web/api healthy, traefik маршрутизирует, worker started."
            exit 0

  notify:
    name: Уведомление (Telegram + почта)
    needs: [preflight, deploy]
    # Всегда, когда деплой вообще был предметом разговора: и успех, и провал,
    # и «пропущен». Без секретов ВМ уведомлять не о чем.
    if: always() && needs.preflight.result == 'success' && needs.preflight.outputs.has-vm-secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Собрать текст уведомления
        id: msg
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_SKIPPED: ${{ needs.deploy.outputs.skipped }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.expected-sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          SHA="$EXPECTED_SHA"
          if [ -z "$SHA" ]; then
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          fi
          SHORT="$(printf '%.8s' "$SHA")"
          AUTHOR="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" --jq '.commit.author.name' 2>/dev/null || echo '?')"
          TITLE="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" --jq '.commit.message | split("\n")[0]' 2>/dev/null || echo '?')"
          STARTED="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at 2>/dev/null || echo '')"
          if [ -n "$STARTED" ]; then
            MINUTES=$(( ( $(date -u +%s) - $(date -u -d "$STARTED" +%s) ) / 60 ))
          else
            MINUTES="?"
          fi

          if [ "$DEPLOY_SKIPPED" = "true" ]; then
            STATUS="skipped"; ICON="⏭"; HEAD="Деплой пропущен — main ушёл вперёд, следующий прогон задеплоит новый коммит"
          elif [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS="success"; ICON="✅"; HEAD="Деплой masterryadom.ru успешен"
          elif [ "$DEPLOY_RESULT" = "cancelled" ]; then
            STATUS="cancelled"; ICON="⚪"; HEAD="Деплой отменён"
          else
            STATUS="failure"; ICON="❌"; HEAD="Деплой ПРОВАЛЕН — см. лог прогона (автооткат на :previous, если он был возможен)"
          fi
          TRIGGER="автоматически после CI"
          [ "$EVENT_NAME" = "workflow_dispatch" ] && TRIGGER="вручную"

          # Telegram parse_mode=HTML — экранируем пользовательский текст коммита.
          esc() { printf '%s' "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }
          {
            echo "status=$STATUS"
            echo "subject=${ICON} ${HEAD} · ${SHORT}"
            echo "html<<EOF_HTML"
            echo "${ICON} <b>$(esc "$HEAD")</b>"
            echo "🔖 <code>${SHORT}</code> — $(esc "$TITLE") ($(esc "$AUTHOR"))"
            echo "⏱ ${MINUTES} мин · ${TRIGGER}"
            echo "🔗 ${RUN_URL}"
            echo "EOF_HTML"
            echo "text<<EOF_TEXT"
            echo "${ICON} ${HEAD}"
            echo "Коммит: ${SHORT} — ${TITLE} (${AUTHOR})"
            echo "Длительность: ${MINUTES} мин · запуск: ${TRIGGER}"
            echo "Прогон: ${RUN_URL}"
            echo "EOF_TEXT"
          } >> "$GITHUB_OUTPUT"

      - name: Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HTML: ${{ steps.msg.outputs.html }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::notice::TG_BOT_TOKEN / TG_CHAT_ID не заданы — Telegram-уведомление пропущено."
            exit 0
          fi
          curl -sS -o /dev/null -w 'telegram HTTP %{http_code}\n' \
            -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${HTML}"

      - name: Почта — секреты заданы?
        id: smtp
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ] && [ -n "$NOTIFY_EMAIL_TO" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SMTP_USER / SMTP_PASS / NOTIFY_EMAIL_TO не заданы — письмо пропущено."
          fi

      - name: Почта
        if: steps.smtp.outputs.ok == 'true'
        # SMTP Яндекса, порт 465 = implicit TLS (secure: true). From обязан быть
        # логином или его алиасом — noreply@ это алиас деплой-ящика (MAIL-MIGRATION-01).
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.yandex.ru
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: МастерРядом · деплой <noreply@masterryadom.ru>
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          subject: ${{ steps.msg.outputs.subject }}
          body: ${{ steps.msg.outputs.text }}
