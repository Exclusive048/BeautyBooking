# Production docker-compose — образы собираются ЛОКАЛЬНО на ВМ, реестра нет
# (CI-DEPLOY-NOREGISTRY-01, решение владельца 2026-08-07).
#
# ── Что и где живёт (APP-TIER-SPLIT-02, 2026-08-31 — сверено с боевым стендом) ──
# Файл описывает ДВА хоста через compose-профили:
#   • профиль `app` — ВМ приложения (`/opt/app`, root): traefik + web + api +
#     worker + redis;
#   • профиль `db`  — хост Postgres (порт 5861 наружу в приватную сеть) + migrate.
# `DATABASE_URL` в .env.production указывает на приватный адрес хоста БД
# (`10.0.0.x:5861`), а не на `postgres:5432` — если БД поднята на ДРУГОЙ машине.
#
# Usage на ВМ приложения (порядок автоматизирован в .github/workflows/deploy.yml):
#   C="docker compose --env-file .env.production -f docker-compose.prod.yml"
#   $C --profile app build worker
#   $C --profile app build web              # api берёт тот же образ
#   $C --profile db  run --rm --no-deps migrate   # --no-deps: локальный postgres НЕ поднимать
#   $C --profile app up -d --remove-orphans
#
# ── Топология яруса приложения ─────────────────────────────────────────────────
# `traefik` — единственный сервис с портами наружу (80/443): терминирует TLS
# (Let's Encrypt, HTTP-01), редиректит http→https и ДЕЛИТ трафик между двумя
# контейнерами ОДНОГО образа `beautyhub-app`: `/api/*` → `api`, всё остальное
# (страницы, RSC, `/_next/*`, service worker) → `web`. Смысл разделения —
# независимый рестарт и масштабирование половин без правок кода: обе — тот же
# `node server.js`, различаются только тем, какой трафик до них доходит.
# `build:` объявлен ТОЛЬКО у `web` — образ собирается один раз (как `migrate`
# берёт образ `worker`). Сторож топологии — src/lib/http/app-tier-topology.test.ts.
#
# 🔴 Клиентский IP / TRUSTED_PROXY_HOPS: traefik по умолчанию НЕ доверяет
# входящим X-Forwarded-* (нет `forwardedHeaders.trustedIPs`) — он их отбрасывает
# и ставит свой X-Forwarded-For из адреса соединения. То есть traefik — ровно
# ОДИН доверенный хоп, и дефолт `TRUSTED_PROXY_HOPS=1` верен, пока перед ним нет
# облачного балансировщика. Появится LB — добавить его адреса в
# `--entrypoints.websecure.forwardedHeaders.trustedIPs` И поднять хопы до 2;
# `forwardedHeaders.insecure=true` не включать никогда (это доверие клиентскому
# XFF = обход всех per-IP лимитов). Проверка — DEPLOY-BACKLOG.md §2.1.
# ⚠️ Access-log traefik выключен намеренно: `RequestPath` в нём содержит
# query-строку, а в `?token=` вебхука ЮКассы едет секрет (DEPLOY-CHECKLIST 3.9).
# Включать только с `--accesslog.fields.names.RequestPath=drop`.
# Тело запроса traefik не ограничивает — авторитетные лимиты в приложении
# (SEC-16: JSON 1 МБ, multipart по роутам). SSE traefik не буферизует.
#
# Required env (in .env.production):
#   POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD — профиль `db`
#   REDIS_PASSWORD    - Redis requirepass value
#   DATABASE_URL      - postgresql://user:pass@<хост БД>:5861/db (см. выше)
#   REDIS_URL         - redis://:pass@redis:6379
#   TRAEFIK_ACME_EMAIL - почта для Let's Encrypt
#   NEXT_PUBLIC_APP_URL - ИМЕННО под этим именем (алиас APP_PUBLIC_URL, который
#                       понимает env.ts, в build-args НЕ интерполируется);
#                       пустое/отсутствующее значение РОНЯЕТ сборку web —
#                       new URL("") в root-layout бросает на сборе page-data.
#
# ⚠️ NEXT_PUBLIC_* — тоже в .env.production, и это НЕ только runtime-env: compose
# интерполирует их в build-args сервиса `web` (см. ниже). Каждый NEXT_PUBLIC_*
# инлайнится в клиентский бандл НА СБОРКЕ (src/lib/env.client.ts `clientEnv`);
# значение, заданное только в runtime, до браузера НЕ доедет — прецедент
# «8 переменных запеклись пустыми» (DOCKER-READINESS-AUDIT-01). Список args
# обязан оставаться в локстепе с ARG-блоком Dockerfile и с build-images.yml
# (CI-заглушки).
#
# BUILD_NODE_OPTIONS (опционально): heap-кап для `next build` на ВМ — сборка идёт
# рядом с работающим приложением, дефолт --max-old-space-size=2048 защищает от OOM.
# NEXT_PUBLIC_GLITCHTIP_RELEASE экспортирует деплой-скрипт (короткий SHA).

services:
  traefik:
    image: traefik:v3.7
    profiles: ["app"]
    restart: unless-stopped
    command:
      # Docker provider. Наружу — только контейнеры с traefik.enable=true.
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # HTTP / HTTPS entrypoints; весь http редиректится на https.
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt, HTTP-01 на :80.
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_letsencrypt:/letsencrypt"
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # One-shot schema migration — `prisma migrate deploy`, then exits 0. Uses the
  # worker image (Prisma CLI + schema + matching engine). Профиль `db`: на хосте
  # БД гейтится здоровьем postgres; с ВМ приложения запускается
  # `--profile db run --rm --no-deps migrate` — тогда локальный postgres не
  # стартует, а миграция идёт по DATABASE_URL на хост БД. Идемпотентно.
  migrate:
    profiles: ["db"]
    image: beautyhub-worker:latest
    restart: "no"
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── web / api: один образ, два контейнера ──────────────────────────────────
  # Блоки обязаны оставаться ЗЕРКАЛЬНЫМИ, кроме трёх отличий: `build:` только у
  # web; loopback-порт 3000 только у api (host-cron и локальные пробы —
  # DEPLOY-CHECKLIST 3.2); traefik-роутеры разные. Паритет пиннится сторожем
  # src/lib/http/app-tier-topology.test.ts.
  web:
    profiles: ["app"]
    image: beautyhub-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Значения интерполируются из .env.production (--env-file). См. шапку файла:
        # пропущенная переменная запекается в бандл ПУСТОЙ без ошибки — с одним
        # исключением: пустой NEXT_PUBLIC_APP_URL роняет сборку (new URL("")).
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
        NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
        NEXT_PUBLIC_LEGAL_INN: ${NEXT_PUBLIC_LEGAL_INN:-}
        NEXT_PUBLIC_VK_COMMUNITY_URL: ${NEXT_PUBLIC_VK_COMMUNITY_URL:-}
        NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN:-}
        NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT: ${NEXT_PUBLIC_GLITCHTIP_ENVIRONMENT:-production}
        NEXT_PUBLIC_GLITCHTIP_RELEASE: ${NEXT_PUBLIC_GLITCHTIP_RELEASE:-}
        # Heap-кап next build при сборке на ВМ (см. шапку). CI-сборка образов идёт
        # НЕ через compose и капа не получает (у ARG в Dockerfile дефолт пустой).
        BUILD_NODE_OPTIONS: ${BUILD_NODE_OPTIONS:---max-old-space-size=2048}
    restart: unless-stopped
    # RES-16: 10 c дефолта — это верхняя граница на добивание in-flight
    # запросов при деплое. 30 c дают завершиться самому долгому легитимному
    # запросу (загрузка медиа с re-encode) вместо обрыва соединения клиенту.
    stop_grace_period: 30s
    env_file: .env.production
    depends_on:
      # postgres/migrate — профиль `db`; `required: false` позволяет `--profile app`
      # на ВМ, где БД поднята отдельно. Когда оба профиля активны, гейты действуют.
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
        required: false
    networks:
      - internal
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      # Всё, что не /api/* — страницы. Приоритет НИЖЕ, чем у api.
      - "traefik.http.routers.web.rule=Host(`masterryadom.ru`)"
      - "traefik.http.routers.web.priority=10"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.service=web"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      # MAINTENANCE-PAGE-01: пока web поднимается или лежит (502–504), traefik
      # подменяет ответ страницей работ из сервиса maintenance.
      - "traefik.http.routers.web.middlewares=maintenance-html"
    healthcheck:
      # Node 20 ships a global fetch(), so no curl/wget is needed in the slim
      # runner image.
      #
      # FIX-C2: /api/health is a LIVENESS probe — "can this process serve at
      # all", no dependency I/O. It deliberately does NOT go 503 when Redis is
      # down. A Redis outage is a partial, by-design degradation (sensitive
      # routes fail closed, inv. #6; the public storefront keeps serving), and
      # marking the container unhealthy for it would pull the only instance out
      # of the load balancer — turning a partial outage into a total one.
      # Dependency state lives at /api/health/ready and is checked by deploy.yml
      # as a post-deploy gate, where "this build cannot reach Postgres" is
      # actionable (roll back) rather than merely reported.
      #
      # Generous start_period so a cold Next.js boot is not counted as unhealthy.
      # NOTE: `restart: unless-stopped` does NOT restart on unhealthy — plain
      # Compose has no such behaviour. This status is consumed by deploy.yml and
      # by whatever external monitor DevOps wires up, nothing else.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  api:
    profiles: ["app"]
    # Тот же образ, что у web — собирается `build web`, здесь build: нет намеренно.
    image: beautyhub-app:latest
    restart: unless-stopped
    # RES-16 — см. web; у api тот же самый долгий легитимный запрос (загрузка медиа).
    stop_grace_period: 30s
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
        required: false
    networks:
      - internal
    expose:
      - "3000"
    # 🔴 ТОЛЬКО loopback: host-cron (четыре cron-эндпоинта под /api/*) и
    # локальные пробы деплоя ходят сюда мимо traefik. Наружу (0.0.0.0) не
    # публиковать — запрос мимо traefik приходит без доверенного XFF.
    ports:
      - "127.0.0.1:3000:3000"
    labels:
      - "traefik.enable=true"
      # `/api` и `/api/*` — REST, SSE-стрим уведомлений, вебхук ЮКассы, OAuth
      # start/callback, cron/health. Приоритет ВЫШЕ, чем у web. Именно
      # `Path || PathPrefix('/api/')`, а не `PathPrefix('/api')`: последний —
      # строковый префикс и забрал бы гипотетический `/apiary`.
      - "traefik.http.routers.api.rule=Host(`masterryadom.ru`) && (Path(`/api`) || PathPrefix(`/api/`))"
      - "traefik.http.routers.api.priority=20"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
      # MAINTENANCE-PAGE-01: для API — JSON-конверт 503, не HTML.
      - "traefik.http.routers.api.middlewares=maintenance-json"
    healthcheck:
      # Liveness in-container, зеркало web (FIX-C2 — см. комментарий там).
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Страница «идут работы» (MAINTENANCE-PAGE-01, 2026-09-01) ─────────────────
  # Статический nginx с одной страницей в стиле продукта (deploy/maintenance/).
  # Включать/выключать не нужно — она появляется ровно тогда, когда приложение
  # не отвечает, двумя механизмами traefik:
  #   (1) fallback-роутер с приоритетом 1 (ниже web=10 и api=20): когда
  #       контейнеры web/api остановлены, их роутеры исчезают из traefik, и
  #       трафик достаётся этому;
  #   (2) errors-middleware на роутерах web/api: ответы 502–504 (контейнер
  #       есть, но ещё не слушает / упал) подменяются телом отсюда — HTML для
  #       страниц, JSON-конверт для /api/*.
  # Ориентир окончания работ (/state/eta.json) пишет deploy.yml перед `up -d`
  # и снимает после успеха; без файла страница показывает общую формулировку.
  maintenance:
    profiles: ["app"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./deploy/maintenance/index.html:/usr/share/nginx/html/index.html:ro
      - ./deploy/maintenance/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.maintenance-state:/usr/share/nginx/html/state:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maintenance.rule=Host(`masterryadom.ru`)"
      - "traefik.http.routers.maintenance.priority=1"
      - "traefik.http.routers.maintenance.entrypoints=websecure"
      - "traefik.http.routers.maintenance.tls=true"
      - "traefik.http.routers.maintenance.tls.certresolver=letsencrypt"
      - "traefik.http.routers.maintenance.service=maintenance"
      - "traefik.http.services.maintenance.loadbalancer.server.port=80"
      - "traefik.http.middlewares.maintenance-html.errors.status=502-504"
      - "traefik.http.middlewares.maintenance-html.errors.service=maintenance"
      - "traefik.http.middlewares.maintenance-html.errors.query=/index.html"
      - "traefik.http.middlewares.maintenance-json.errors.status=502-504"
      - "traefik.http.middlewares.maintenance-json.errors.service=maintenance"
      - "traefik.http.middlewares.maintenance-json.errors.query=/api/maintenance"
      # SEO-WWW-01: www → основной адрес, 301 с путём и query. DNS-запись `www`
      # смотрит на этот сервер, а роутера для неё не было: браузер видел
      # самоподписанный сертификат traefik и 404. Роутер живёт здесь, а не у
      # web: maintenance не пересоздаётся деплоем, и переадресация не
      # пропадает на время `up -d`. Сертификат для www выпускает тот же LE;
      # сервис указан только потому, что роутеру он обязателен — до него
      # запрос не доходит, ответ отдаёт middleware.
      - "traefik.http.routers.www.rule=Host(`www.masterryadom.ru`)"
      - "traefik.http.routers.www.entrypoints=websecure"
      - "traefik.http.routers.www.tls=true"
      - "traefik.http.routers.www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.www.middlewares=www-to-apex"
      - "traefik.http.routers.www.service=maintenance"
      - "traefik.http.middlewares.www-to-apex.redirectregex.regex=^https?://www[.]masterryadom[.]ru/(.*)"
      - "traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://masterryadom.ru/$${1}"
      - "traefik.http.middlewares.www-to-apex.redirectregex.permanent=true"
    # 🔴 Healthcheck здесь НАМЕРЕННО отсутствует. Docker-провайдер traefik не
    # читает метки контейнера, пока его healthcheck в состоянии `starting`, а
    # именно на этих метках определены middleware `maintenance-*`, на которые
    # ссылаются роутеры web/api. С healthcheck'ом (первая проба через 30 с)
    # роутеры web/api всё это окно отключены — «middleware does not exist» —
    # и traefik отдаёт 404 на ВСЁ; так провалился первый автодеплой
    # (MAINTENANCE-PAGE-01, прогон 33449906187). Без healthcheck'а nginx
    # виден traefik'у с первой миллисекунды. Пин — app-tier-topology.test.ts.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  worker:
    profiles: ["app"]
    image: beautyhub-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    # RES-16: docker-дефолт — 10 c, и это меньше, чем идёт длинная джоба
    # (`media.purge` пачкой объектов, `mrr.snapshot`, масс-рассылка). Цикл
    # воркера проверяет `isShuttingDown` только на витке, то есть текущую
    # джобу он дорабатывает, а SIGKILL её обрывает. Потери при этом нет —
    # джоба остаётся в `queue:processing`, и `recoverStuckJobs` подберёт её по
    # staleness, — но это +5 минут задержки и лишний attempt на КАЖДЫЙ деплой.
    # 60 c: с запасом перекрывает и джобу, и `flushReports(2000)` в конце.
    stop_grace_period: 60s
    env_file: .env.production
    # WORKER-PING-HAIRPIN-01 (2026-09-01): воркер каждые 30 с пингует
    # `NEXT_PUBLIC_APP_URL`/api/health/worker (lib/queue/healthcheck-ping.ts) —
    # без этой строки запрос идёт на ПУБЛИЧНЫЙ IP, а облачный NAT изнутри ВМ
    # назад не заворачивает (hairpin) → вечный таймаут, и /api/health/worker
    # всегда отвечает «воркер мёртв» при живом воркере. Маппинг ведёт домен на
    # host-gateway (docker0 хоста), где traefik слушает 443 с настоящим
    # сертификатом — TLS/SNI работают, кода правка не требует. Действует
    # только внутри контейнера worker.
    extra_hosts:
      - "masterryadom.ru:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
        required: false
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    profiles: ["db"]
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # Публикуется для ВМ приложения по приватной сети (DATABASE_URL → <хост>:5861).
    # Порт обязан быть закрыт снаружи файрволом/security-group хоста.
    ports:
      - "5861:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beautyhub}
      POSTGRES_USER: ${POSTGRES_USER:-beautyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-beautyhub} -d ${POSTGRES_DB:-beautyhub}"
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    profiles: ["app"]
    image: redis:7-alpine
    restart: unless-stopped
    # RES-27: очередь задач и кэш живут в ОДНОМ инстансе, поэтому политика
    # вытеснения — не настройка производительности, а вопрос сохранности задач.
    # `noeviction` и так дефолт, но именно поэтому его и записываем: будущее
    # «поставим allkeys-lru, а то память растёт» выглядит как безобидный тюнинг
    # и молча начнёт выбрасывать элементы `queue:jobs` — потерянная бронь-
    # напоминание или вебхук ЮКассы, без единой ошибки в логах. Политика
    # действует на ВЕСЬ инстанс, включая все логические БД, так что «развести
    # кэш и очередь по SELECT 1» от этого не защищает — защищают только разные
    # инстансы. Сторожится тестом `queue/redis-eviction-policy.test.ts`.
    # `maxmemory` намеренно не задан здесь: при `noeviction` достижение лимита
    # означает отказ на запись (то есть отказ enqueue), поэтому число обязано
    # считаться от фактической памяти машины — строка в DEPLOY-BACKLOG.
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test:
        - "CMD"
        - "redis-cli"
        - "-a"
        - "${REDIS_PASSWORD}"
        - "ping"
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  traefik_letsencrypt:
