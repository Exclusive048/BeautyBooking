# Development docker-compose — runs only the backing services.
# The Next.js app and worker run locally via `npm run dev` and `npm run worker`.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#
# DATABASE_URL=postgresql://master:master123@localhost:5432/masterryadom
# REDIS_URL=redis://localhost:6379
#
# Naming note (LOCAL-DEV-CLEANUP 2026-05-29):
# Container/DB/user/volume names match the actual manually-created setup that
# pre-dated this compose file. If a `pgdata` volume already exists from prior
# manual `docker run`, compose will reuse it (no re-init, data preserved). For
# a fresh checkout, compose creates `pgdata` on first `up -d` and `prisma
# migrate deploy` populates the schema. Redis preserved as-is — never had a
# pre-existing manual volume to align with.

services:
  postgres:
    container_name: masterryadom-db
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: masterryadom
      POSTGRES_USER: master
      POSTGRES_PASSWORD: master123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

  # QA-HARNESS-EMAIL-01 — local mail sink (mailhog-class). Dev/QA only; the
  # production stack is unaffected (real SMTP is a provisioning item there).
  #
  # Why this exists at all — two measured facts, not a preference:
  #
  #  1. **Speed.** `POST /api/auth/otp/email/request` writes the `OtpCode` row
  #     BEFORE it `await`s `sendEmail`, but it awaits it before responding — and
  #     `login-client.tsx` only advances to the OTP step on that response. With
  #     an unreachable SMTP host the request measured **23.0 s / 21.1 s**, so
  #     every cold email login paid ~21 s of dead wait. The closed deploy is
  #     email-only, so that is the cost of *every* prod-like QA login.
  #
  #  2. **Safety.** `.env` points SMTP at a REAL public host (smtp.yandex.ru)
  #     with real credentials. On any dev machine where that host IS reachable,
  #     cold email QA runs would send real mail — and one seeded identity
  #     (`elena.petrova.91@yandex.ru`) is an external-looking address, not a
  #     `@test.masterryadom.local` one. A sink makes dev delivery inert by
  #     construction rather than by luck of the network.
  #
  # Point dev SMTP at it (`.env.local`, gitignored — no auth, no TLS):
  #   SMTP_HOST=localhost
  #   SMTP_PORT=1025
  #   SMTP_USER=dev
  #   SMTP_PASS=dev
  # `isEmailConfigured()` requires HOST+USER+PASS to be non-empty, hence the
  # dummy credentials — mailpit accepts anything by default.
  #
  # Web UI: http://localhost:8025 (inspect delivered mail; the QA harness does
  # NOT read it — `recoverOtp` brute-forces the codeHash from Postgres and stays
  # independent of both logs and mailbox).
  mailpit:
    container_name: masterryadom-mailpit
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "500"

volumes:
  pgdata:
    name: pgdata
  redis_dev_data:
