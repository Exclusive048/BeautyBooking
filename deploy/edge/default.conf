# ─── Внутренний edge: маршрутизация web / api (APP-TIER-SPLIT-01, 2026-08-30) ──
#
# Зачем он есть. Приложение — ОДИН образ `beautyhub-app`, но в проде оно
# поднимается двумя контейнерами: `web` (страницы, RSC, статика `/_next/*`,
# service worker) и `api` (`/api/*` — REST, SSE, вебхуки, OAuth-колбэки). Это
# даёт независимый рестарт и масштабирование двух половин без единой правки
# кода: обе половины — тот же `node server.js`, различаются только тем, какой
# трафик до них доходит. Решает это разделение ЭТОТ nginx.
#
# Контракт с внешним миром НЕ менялся: как и раньше, наружу (на loopback ВМ)
# торчит ровно один порт `127.0.0.1:3000` — теперь его держит nginx, а не Next.
# Внешний обратный прокси / TLS-терминатор (вне репозитория, на стороне хоста)
# продолжает форвардить на `127.0.0.1:3000` и ничего про web/api не знает.
#
# 🔴 Этот nginx — НЕ хоп в смысле `TRUSTED_PROXY_HOPS`. Он передаёт
# `X-Forwarded-For` / `X-Forwarded-Proto` / `X-Forwarded-Host` / `X-Real-IP`
# СКВОЗНЫМИ, как пришли от внешнего edge'а (`$http_x_forwarded_for`), а НЕ
# дописывает свой адрес (`$proxy_add_x_forwarded_for`). Поэтому число хопов,
# которое видит приложение, равно числу ВНЕШНИХ прокси — ровно как до
# разделения, и значение `TRUSTED_PROXY_HOPS` при переходе не меняется.
# Это безопасно ровно потому, что порт опубликован ТОЛЬКО на loopback: единственный,
# кто может сюда постучаться, — внешний edge на этой же машине. Опубликовать
# порт наружу (0.0.0.0) = доверить клиентскому XFF. Не делать.
# Проверка после деплоя та же — `GET /api/admin/diagnostics/client-ip`
# (DEPLOY-BACKLOG.md §2.1), она видит итог всей цепочки.
#
# 🔴 Access-log без query-строки. В `?token=` вебхука ЮКассы едет секрет
# (DEPLOY-CHECKLIST 3.9), поэтому формат лога использует `$uri` (без аргументов),
# а не `$request`/`$request_uri`. Не «улучшать» на стандартный `combined`.
#
# Конфиг сторожится тестом `src/lib/http/edge-topology.test.ts` (маршруты,
# сквозные заголовки, формат лога, буферизация SSE, лимит тела).

# Имена сервисов резолвятся ЧЕРЕЗ переменные и встроенный DNS Docker'а
# (127.0.0.11) с коротким TTL — иначе nginx резолвит `web`/`api` один раз на
# старте и после пересоздания контейнера (новый IP на каждом деплое) отдаёт 502
# до собственного рестарта. Ровно этот сценарий — «перекатили api, web не
# трогали» — и есть цель разделения, он обязан работать без рестарта edge'а.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# `$uri` — путь без query-строки (см. шапку). `$upstream_addr` показывает, в
# какую половину ушёл запрос, — это первое, что нужно при разборе маршрутизации.
log_format edge '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                '$status $body_bytes_sent up=$upstream_addr rt=$request_time '
                'urt=$upstream_response_time';

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    access_log /var/log/nginx/access.log edge;

    # Верхняя граница тела на этом уровне — загрузка медиа: MEDIA_MAX_FILE_SIZE_BYTES
    # = 10 МБ (src/lib/media/types.ts) плюс накладные multipart. Авторитетные
    # лимиты — в приложении (SEC-16: JSON — 1 МБ, multipart — по роутам); здесь
    # только защита от заведомо абсурдного тела. Дефолт nginx (1m) ЛОМАЛ БЫ
    # загрузку портфолио — не снижать.
    client_max_body_size 16m;

    # Ответы Next несут длинные заголовки (CSP с nonce, две сессионные куки,
    # Link-прелоады) — дефолтных 4k/8k может не хватить, и nginx отдаст 502
    # «upstream sent too big header». Запас с большим отрывом.
    proxy_buffer_size        32k;
    proxy_buffers            8 32k;
    proxy_busy_buffers_size  64k;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    # Сквозная передача (см. шапку — этот nginx не хоп). Пустое значение nginx
    # не пересылает вовсе, то есть отсутствующий заголовок остаётся отсутствующим.
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $http_x_forwarded_host;
    proxy_set_header X-Real-IP         $http_x_real_ip;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    set $web http://web:3000;
    set $api http://api:3000;

    # SSE-стрим уведомлений: буферизация выключена, чтение без 60-секундного
    # обрыва (приложение шлёт `: ping` heartbeat'ы, но 60 с — граница по
    # умолчанию для ЛЮБОЙ паузы). Внешний edge обязан вести себя так же
    # (docs/DEPLOYMENT-ARCHITECTURE.md §1.7).
    location = /api/notifications/stream {
        proxy_pass $api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Вся API-поверхность — в `api`: REST, вебхук ЮКассы, OAuth start/callback,
    # cron- и health-эндпоинты. `^~` — префикс побеждает regex-локации, которых
    # тут нет, но которые кто-нибудь однажды добавит.
    location ^~ /api/ {
        proxy_pass $api;
    }

    # Всё остальное — страницы, RSC-запросы (`?_rsc=`), Server Actions (POST на
    # URL страницы), `/_next/static`, `/_next/image`, `sw.js`, `/offline` — в `web`.
    location / {
        proxy_pass $web;
    }
}
