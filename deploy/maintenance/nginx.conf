# MAINTENANCE-PAGE-01 — сервис `maintenance` (docker-compose.prod.yml).
#
# Всё, что сюда приходит, — это время, когда приложение не отвечает: либо
# web/api остановлены (traefik-роутер с приоритетом 1 ловит трафик), либо они
# отдали 502–504 и errors-middleware traefik запросил отсюда тело. Поэтому
# страница отдаётся со статусом 503 + Retry-After: для браузера это «временно»,
# для поисковиков — «не выкидывать из индекса».
#
# /api/* получает JSON того же конверта, что и приложение (`ok:false`, `error`),
# чтобы клиентский код показал сообщение, а не упал на разборе HTML.
# /state/eta.json — ориентир окончания работ, пишет деплой-скрипт (bind-mount
# ./.maintenance-state, read-only здесь).

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html;

    error_page 503 /index.html;

    # Прямой запрос страницы — 200 (так её забирает errors-middleware traefik,
    # он сам подставит исходный код 502–504 в ответ клиенту).
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Retry-After "120" always;
    }

    location ^~ /state/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Тело для errors-middleware роутера api.
    location = /api/maintenance {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "120" always;
        return 503 '{"ok":false,"error":{"code":"MAINTENANCE","message":"Идут работы по обновлению. Попробуйте через несколько минут."}}';
    }

    # Любой API-запрос в режиме работ (fallback-роутер) — тот же JSON и 503.
    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "120" always;
        return 503 '{"ok":false,"error":{"code":"MAINTENANCE","message":"Идут работы по обновлению. Попробуйте через несколько минут."}}';
    }

    # Страницы — 503 с телом index.html (через error_page).
    location / {
        return 503;
    }
}
